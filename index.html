<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Granja">
<title>Mi Granja Fit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF6; --card:#FFFFFF; --line:#EEE9DF; --line2:#E2DCCF;
  --ink:#3D3A35; --ink2:#6E685E; --muted:#A39C8F;
  --comb:#E0644F; --comb-soft:#FCEBE7;
  --straw:#F2C46D; --straw-soft:#FDF5E3;
  --sage:#6FA287; --sage-dark:#4F8068; --sage-soft:#EAF3EE;
  --sky:#EEF5F8;
  --r:18px; --shadow:0 1px 2px rgba(60,50,30,.04), 0 4px 16px rgba(60,50,30,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(251,250,246,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-weight:900;font-size:19px;letter-spacing:-.3px;flex:1;display:flex;align-items:center;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-weight:800;font-size:14px}
.lvl{display:flex;align-items:center;gap:10px;padding:0 0 10px;font-size:13px;color:var(--ink2);font-weight:700}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--straw);transition:width .4s}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:14px 0}
.card h2{margin:0 0 4px;font-size:19px;font-weight:900;letter-spacing:-.2px}
.card h3{margin:0;font-size:16px;font-weight:800}
.sub{color:var(--ink2);font-size:14px}
.tiny{color:var(--muted);font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sec-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:22px 4px 0}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;font-weight:800;font-size:16px;background:var(--sage);color:#fff;transition:transform .1s, background .2s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--sage-soft);color:var(--sage-dark)}
.btn.warm{background:var(--comb);color:#fff}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
.btn.small{width:auto;padding:8px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}

.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-weight:800;font-size:13px;color:var(--ink2)}
.chip .ci{font-size:20px;line-height:1.1}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.next{border-color:var(--sage);color:var(--sage-dark)}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:800;background:var(--straw-soft);color:#9A6B12}
.badge.green{background:var(--sage-soft);color:var(--sage-dark)}
.badge.red{background:var(--comb-soft);color:#B4412E}

/* ---------- Exercises ---------- */
.ex{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:12px;background:#fff}
.ex.complete{background:var(--sage-soft);border-color:#CFE3D7}
.ex-head{display:flex;gap:10px;align-items:flex-start}
.ex-num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--straw-soft);color:#9A6B12;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.ex.complete .ex-num{background:var(--sage);color:#fff}
.ex-name{font-weight:800;font-size:16px;line-height:1.25}
.ex-meta{font-size:13px;color:var(--ink2);margin-top:2px}
.ex-last{font-size:12px;color:var(--muted);margin-top:4px}
.ex-up{font-size:12px;font-weight:700;color:var(--sage-dark);background:var(--sage-soft);border-radius:10px;padding:6px 9px;margin-top:6px}
.goal-opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line2);border-radius:16px;background:#fff;font-size:15px}
.goal-opt.on{border-color:var(--sage);background:var(--sage-soft)}
.info-btn{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);color:var(--ink2);font-weight:800;font-size:13px}
.ex-desc{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;color:var(--ink2)}

.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:20px 1fr 1fr 46px;gap:6px;align-items:center}
.set .sn{font-weight:800;color:var(--muted);font-size:14px;text-align:center}
.stp{display:flex;align-items:center;border:1px solid var(--line2);border-radius:12px;background:#fff;height:46px;overflow:hidden}
.stp button{width:30px;height:100%;font-size:20px;font-weight:700;color:var(--ink2);flex:0 0 auto}
.stp button:active{background:var(--bg)}
.stp label{flex:1;display:flex;align-items:baseline;justify-content:center;gap:2px;min-width:0}
.stp input{width:100%;min-width:0;border:none;background:transparent;text-align:center;font-size:17px;font-weight:800;padding:0;outline:none;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp .u{font-size:12px;color:var(--muted);font-weight:700;flex:0 0 auto;padding-right:2px}
.chk{width:46px;height:46px;border-radius:12px;border:2px solid var(--line2);color:transparent;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;background:#fff}
.set.done .chk{background:var(--sage);border-color:var(--sage);color:#fff}
.set.done .stp{background:transparent;border-color:#CFE3D7}
.set-head{display:grid;grid-template-columns:20px 1fr 1fr 46px;gap:6px;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center}

details.wu{margin-top:12px;border:1px dashed var(--line2);border-radius:14px;padding:10px 14px}
details.wu summary{font-weight:800;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
details.wu summary::-webkit-details-marker{display:none}
.wu-item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.wu-item:first-of-type{border-top:none;margin-top:6px}

.progress-line{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.progress-line>i{display:block;height:100%;background:var(--sage);border-radius:99px;transition:width .3s}

/* ---------- Kegel ---------- */
.kegels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.kg-slot{border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;background:#fff}
.kg-slot .ic{font-size:26px}
.kg-slot .t{font-weight:800;font-size:14px;margin-top:2px}
.kg-slot .h{font-size:12px;color:var(--muted)}
.kg-slot.done{background:var(--sage-soft);border-color:#CFE3D7}
.kg-slot.done .t{color:var(--sage-dark)}

/* ---------- Farm ---------- */
.scene{position:relative;height:260px;border-radius:var(--r);overflow:hidden;background:linear-gradient(#F4F9FB 0 34%, #E4F0E2 34% 100%);border:1px solid var(--line)}
.fence{position:absolute;left:0;right:0;top:27%;height:30px;background:
  repeating-linear-gradient(90deg, transparent 0 22px, #FFFFFF 22px 30px),
  linear-gradient(transparent 0 7px,#fff 7px 11px,transparent 11px 19px,#fff 19px 23px,transparent 23px);
  filter:drop-shadow(0 1px 0 #D9D2C3)}
.barn{position:absolute;right:14px;top:6%;width:84px}
.tree{position:absolute;font-size:34px;top:13%}
.cloud{position:absolute;top:8%;font-size:26px;opacity:.8;animation:cloud 60s linear infinite}
@keyframes cloud{from{left:-40px}to{left:110%}}
.animal{position:absolute;line-height:1;transform:translate(-50%,-50%);cursor:pointer;user-select:none;transition:filter .2s}
.animal .em{display:inline-block}
.animal .bub{position:absolute;top:-14px;z-index:2;left:50%;transform:translateX(-50%);font-size:15px;background:#fff;border-radius:10px;padding:1px 4px;box-shadow:0 1px 4px rgba(0,0,0,.1);white-space:nowrap}
.animal.sad .em{opacity:.7}
.walk{animation:walk var(--d,9s) ease-in-out infinite alternate}
@keyframes walk{0%{transform:translateX(0)}45%{transform:translateX(var(--dx,30px))}55%{transform:translateX(var(--dx,30px)) scaleX(-1)}100%{transform:translateX(0) scaleX(-1)}}
.peck{animation:peck 2.4s ease-in-out infinite;display:inline-block;transform-origin:60% 90%}
@keyframes peck{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-18deg) translateY(3px)}90%{transform:rotate(0)}}
.egg{position:absolute;font-size:22px;transform:translate(-50%,-50%);cursor:pointer;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}
.scene-empty{position:absolute;inset:auto 0 30px;text-align:center;color:var(--ink2);font-weight:700}

.animals{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.an{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}
.an .em{width:46px;flex:0 0 46px;display:flex;justify-content:center}
.acc-pick{display:flex;gap:8px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.acc-pick button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 8px;border:1px solid var(--line2);border-radius:14px;font-size:11px;font-weight:800;color:var(--ink2);min-width:64px}
.acc-pick button.on{border-color:var(--sage);background:var(--sage-soft);color:var(--sage-dark)}
.an .nm{font-weight:800}
.hbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.hbar>i{display:block;height:100%;border-radius:99px}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.item{border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:4px}
.item .em{display:block;height:52px}
.item .nm{font-weight:800;font-size:14px;line-height:1.2}
.item .ds{font-size:12px;color:var(--ink2);flex:1}
.item.locked{opacity:.55}

/* ---------- Progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .v{font-size:26px;font-weight:900;letter-spacing:-.5px}
.tile .l{font-size:13px;color:var(--ink2);font-weight:700}
select.sel{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:#fff;font-size:16px;font-weight:700;margin-top:10px}
.chart-wrap{position:relative;margin-top:14px}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap;transform:translate(-50%,-120%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
table.t{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
table.t td,table.t th{padding:8px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-top:none}
.hist{border-top:1px solid var(--line);padding:12px 0}
.exlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:2px}
.exb{border:1px solid var(--line2);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800;background:#fff;text-align:left;color:var(--ink);line-height:1.25}
.exb small{display:block;margin-top:3px;font-size:11px;font-weight:700;color:var(--muted)}
.exb small.up{color:var(--sage-dark)} .exb small.down{color:#B4412E}
.exb.on{background:var(--ink);border-color:var(--ink);color:#fff}
.exb.on small{color:rgba(255,255,255,.75)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dw{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--ink2);padding:0;min-width:0}
.cd .ci{font-size:15px;line-height:1.1;min-height:17px}
.cd.w{background:var(--sage-soft);border-color:#CFE3D7;color:var(--sage-dark)}
.cd.r{background:var(--straw-soft);border-color:#F3E0B5}
.cd.today{border:2px solid var(--ink)}
.cd.f{opacity:.35}
.hist:first-child{border-top:none}

/* ---------- Settings ---------- */
.set-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:none}
.set-row .lb{flex:1;font-weight:700}
.set-row .lb small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:6px 10px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.full{margin-bottom:10px}
.seg.full button{flex:1;padding:8px 6px}
.swap{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:99px;border:1px solid var(--line2);font-size:12px;font-weight:800;color:var(--sage-dark);background:#fff}
input[type=time]{border:1px solid var(--line2);border-radius:10px;padding:6px 8px;font-size:15px;font-weight:700;background:#fff}
.switch{width:50px;height:30px;border-radius:99px;background:var(--line2);position:relative;transition:background .2s;flex:0 0 auto}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--sage)}
.switch.on::after{left:23px}

/* ---------- Bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted)}
.nav button .i{font-size:22px;filter:grayscale(1);opacity:.6;transition:all .2s}
.nav button.on{color:var(--ink)}
.nav button.on .i{filter:none;opacity:1;transform:translateY(-1px)}
.nav .dot{position:absolute;margin-left:22px;margin-top:2px;width:8px;height:8px;border-radius:50%;background:var(--comb)}

/* ---------- Rest timer ---------- */
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:40;width:min(528px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.rest .tm{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;min-width:62px}
.rest .lb{flex:1;font-size:13px;font-weight:700;opacity:.8}
.rest button{background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:8px 10px;font-weight:800;font-size:13px}
.rest .rb{position:absolute;left:12px;right:12px;bottom:4px;height:3px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.rest .rb>i{display:block;height:100%;background:var(--straw)}

/* ---------- Player (stretches & kegel) ---------- */
.player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.player .ptop{display:flex;align-items:center;gap:10px;max-width:560px;width:100%;margin:0 auto}
.player .pmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;max-width:460px;margin:0 auto;width:100%}
.ring{position:relative;width:220px;height:220px;margin:10px 0 22px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:900;font-variant-numeric:tabular-nums}
.ring .blob{position:absolute;inset:30px;border-radius:50%;background:var(--sage-soft);transition:transform 1s ease-in-out, background .4s}
.ring.squeeze .blob{transform:scale(.62);background:#D5E9DD}
.ring.relax .blob{transform:scale(1);background:var(--straw-soft)}
.p-title{font-size:24px;font-weight:900;letter-spacing:-.3px}
.p-sub{color:var(--ink2);margin-top:8px;font-size:15px}
.p-next{margin-top:18px;font-size:13px;color:var(--muted);font-weight:700}
.pctl{display:flex;gap:10px;max-width:460px;width:100%;margin:0 auto}
.pctl .btn{flex:1}

/* ---------- Modal & toast ---------- */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(40,35,25,.35);display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:88vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal h2{margin:0 0 6px;font-size:22px;font-weight:900}
.modal input[type=text]{width:100%;padding:13px 14px;border:1px solid var(--line2);border-radius:12px;font-size:17px;font-weight:700;margin:12px 0}
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);animation:tin .25s ease-out;max-width:calc(100% - 32px)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.news{background:var(--straw-soft);border-color:#F5E2B5}
.alert{background:var(--comb-soft);border-color:#F6D3CB}
ul.clean{margin:8px 0 0;padding-left:20px}
ul.clean li{margin:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="restbar"></div>
<div id="overlay"></div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* =====================================================================
   MI GRANJA FIT
   Entrena con mancuernas -> ganas maíz -> alimentas a tus animales ->
   las gallinas bien alimentadas ponen huevos -> con huevos compras más
   animales. Si dejas de entrenar mucho tiempo, pasan hambre y mueren.
   Todo se guarda en este dispositivo (localStorage). Sin cuentas.
   ===================================================================== */

const STORE_KEY = 'granjafit_v1';

/* ---------- Ejercicios (catálogo). El id es la clave del progreso de pesos. ---------- */
const EX = {
  bench:     {n:'Press de banca con mancuernas', d:'Tumbado en banco plano, mancuernas a la altura del pecho. Empuja hacia arriba juntándolas un poco y baja controlando, codos a unos 45°.'},
  shpress:   {n:'Press de hombro sentado', d:'Sentado con la espalda apoyada. Mancuernas a la altura de las orejas, empuja hacia arriba sin arquear la zona lumbar.'},

const MAX_LEVEL = 100;
function xpNeeded(l){ return 180 + (l-1)*15; }
function levelFromXp(xp){
  let l=1, rem=xp;
  while(l<MAX_LEVEL && rem>=xpNeeded(l)){ rem-=xpNeeded(l); l++; }
  return l>=MAX_LEVEL ? {lvl:MAX_LEVEL, into:1, need:1} : {lvl:l, into:rem, need:xpNeeded(l)};
}
function autoTier(lvl){ let t=0; RANKS.forEach((r,i)=>{ if(lvl>=r.min) t=i; }); return t; }
function tier(){ const o=S.settings.tier; return (o==='auto'||o==null) ? autoTier(levelFromXp(S.xp).lvl) : +o; }

const HEN_NAMES = ['Lola','Pepa','Turuleta','Clotilde','Rosita','Margarita','Petra','Chispa','Canela','Nube','Pipa','Paca','Remedios','Manola','Coco','Brígida','Fermina','Tula','Bimba','Pochola','Rufina','Cleo','Mostaza','Galleta'];
const DECAY = 20;          // % de saciedad que pierden al día
const LAY_MIN = 40;        // saciedad mínima para poner huevos
const STARVE_DAYS = 3;     // días a 0 % antes de morir
const CORN_CAP = 40;       // capacidad del granero
const REWARD = {workout:{xp:100, corn:8}, stretch:{xp:20, corn:2}, kegel:{xp:10, corn:1}, rest:{xp:20, corn:2}, finisher:{xp:15, corn:2}, cardio:{xp:15, corn:2}, weigh:{xp:5, corn:0}};

/* ---------- Objetivo. La rutina de fuerza es la misma en los tres casos (es lo que mantiene o
   construye músculo); cambian el descanso, el cardio extra y la comida.
   rate = ritmo sano de cambio de peso, en % del peso corporal por semana. ---------- */

  keep:{n:'Mantener',      e:'⚖️', rest:90,  finisher:false, rate:[-0.25, 0.25], d:'Ganar fuerza y tono sin cambiar mucho de peso.'},
  gain:{n:'Subir de peso', e:'💪', rest:120, finisher:false, rate:[0.1, 0.5],    d:'Ganar músculo comiendo un poco más.'}
};
/* Circuito quemagrasa con mancuernas (recomendado si quieres bajar de peso, opcional si no) */
const FINISHER = [
  ['Thrusters con mancuernas','Sentadilla con las mancuernas en los hombros y, al subir, empújalas por encima de la cabeza en un solo movimiento.'],
  ['Swing con una mancuerna','Coge una mancuerna con las dos manos, lleva la cadera atrás y lánzala hasta el pecho con un golpe de cadera.'],

/* ---------- Utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return dstr(new Date()); }
function addDays(s,n){ const [y,m,d]=s.split('-').map(Number); const x=new Date(y,m-1,d); x.setDate(x.getDate()+n); return dstr(x); }
function daysBetween(a,b){ const p=s=>{const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d);}; return Math.round((p(b)-p(a))/864e5); }
function fmtDate(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'}); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function parseT(t){ const m=/^(\d+)x(\d+)(?:-(\d+))?/.exec(t); return m?{sets:+m[1], rmin:+m[2], rmax:+(m[3]||m[2])}:{sets:1,rmin:10,rmax:10}; }
function fmtKg(k){ return (Math.round(k*100)/100).toString().replace('.',','); }
function plural(n,a,b){ return n===1?a:b; }

/* ---------- Estado ---------- */
let S = null;
function newDay(date){ return {date, gate:null, sets:{}, done:false, partial:0, stretch:false, kegel:[false,false,false], rest:false, finisher:false, cardio:false, up:{}, sid:{}, eq:{}, notified:[false,false,false], openInfo:{}}; }
function freshState(){
  const t=today();
  return {
    v:1, created:t, xp:0, corn:10, eggs:0, pendingEggs:[], cycle:0, gymPref:{},
    streak:0, bestStreak:0, lastActive:null, farmDay:t,

      {id:uid(), type:'pita', name:'Lola', sat:100, starve:0, since:t},

    ],
    graves:[], news:[], last:{}, best:{}, log:[], hist:{}, seenIntro:false, owned:[], weights:{},
    day:newDay(t),
    settings:{rest:90, step:1, tier:'auto', notif:false, kegelTimes:['09:00','15:00','21:00'], goal:null, finisher:false, target:null, place:'home', equip:'mq'}
  };
}
function load(){
  try{ const raw=localStorage.getItem(STORE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return freshState();
}
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} },150); }
function saveNow(){ clearTimeout(saveT); try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') saveNow(); else { if(rollover()) render(); } });

/* ---------- Cambio de día: hambre, huevos, muertes ---------- */
function farmTick(){
  const alive=S.animals;
  const dead=[];
  let laid=0;
  alive.forEach(a=>{
    const sp=SPECIES[a.type];
    if(sp.lay && a.sat>=LAY_MIN){ for(let k=0;k<sp.lay;k++){ if(S.pendingEggs.length<60){ S.pendingEggs.push({id:uid(), x:12+(hash(a.id+S.farmDay+k)%76), y:50+(hash(S.farmDay+a.id+'y'+k)%38)}); laid++; } } }
    if(a.sat<=0){ a.starve=(a.starve||0)+1; }
    a.sat=Math.max(0, a.sat-DECAY);
    if(a.starve>=STARVE_DAYS) dead.push(a);
  });
  dead.forEach(a=>{
    S.animals=S.animals.filter(x=>x!==a);
    S.graves.push({name:a.name, type:a.type, date:S.farmDay});
    S.news.push(`😢 ${a.name} (${SPECIES[a.type].n.toLowerCase()}) ha muerto de hambre.`);
  });
  return laid;
}
function rollover(){
  const t=today();
  let changed=false;
  if(S.farmDay<t){
    let laid=0, n=0;
    while(S.farmDay<t && n<400){ laid+=farmTick(); S.farmDay=addDays(S.farmDay,1); n++; }
    S.farmDay=t;
    if(laid) S.news.unshift(`🥚 Tus gallinas han puesto ${laid} ${plural(laid,'huevo','huevos')}. ¡Ve a recogerlos a la granja!`);
    const hungry=S.animals.filter(a=>a.sat<=20);
    if(hungry.length) S.news.push(`🌽 ${hungry.map(a=>a.name).join(', ')} ${hungry.length>1?'tienen':'tiene'} mucha hambre.`);
    changed=true;
  }
  if(S.day.date!==t){ archiveDay(S.day); S.day=newDay(t); changed=true; }
  if(changed) save();
  return changed;
}

/* ---------- Recompensas ---------- */
function addCorn(n){
  const before=S.corn; S.corn=Math.min(CORN_CAP, S.corn+n);
  if(S.corn-before<n) toast('El granero está lleno 🌾');
  return S.corn-before;
}
function addXp(n){
  const before=levelFromXp(S.xp).lvl, bt=autoTier(before);
  S.xp+=n;
  const after=levelFromXp(S.xp).lvl;
  if(after>before){
    setTimeout(()=>toast(`⭐ ¡Nivel ${after}!`),600);
    const at=autoTier(after);
    if(at>bt) setTimeout(()=>showModal(`<div style="text-align:center;font-size:60px">${RANKS[at].e}</div><h2 style="text-align:center">¡Ahora eres ${RANKS[at].n}!</h2><p class="sub" style="text-align:center">Los entrenamientos suben de nivel: más series, más peso o variantes nuevas. Los Kegel también se alargan.</p><button class="btn" onclick="closeModal()">¡Vamos!</button>`),900);
    const unlocked=Object.values(SPECIES).filter(sp=>sp.lvl>before && sp.lvl<=after);
    unlocked.forEach((sp,i)=>setTimeout(()=>toast(`🔓 Nuevo en el mercado: ${sp.n}`),1400+i*700));
  }
}
function markActive(){
  const t=today();
  if(S.lastActive===t) return;
  S.prevActive={date:S.lastActive, streak:S.streak}; // por si luego se apunta el descanso de ayer
  S.streak = (S.lastActive===addDays(t,-1)) ? S.streak+1 : 1;
  S.lastActive=t;
  S.bestStreak=Math.max(S.bestStreak||0, S.streak);
}
function currentStreak(){ const t=today(); return (S.lastActive===t||S.lastActive===addDays(t,-1)) ? S.streak : 0; }

/* ---------- Entreno de hoy ---------- */
function atGym(){ return S.settings.place==='gym'; }
function nextGate(){ return CYCLE[S.cycle%CYCLE.length]; }
// versión de gimnasio del día (o null si hoy toca en casa). Un entreno ya terminado mantiene dónde se hizo.
function gymDay(g){ const gym = S.day.done ? !!S.day.gym : atGym(); return gym ? GYM[g]||null : null; }
function todayGate(){ return S.day.gate || nextGate(); }
function slotStarted(i){ return S.day.done || (S.day.sets[i]||[]).some(s=>s.done); }
function slotEquip(g,i){ return (S.day.eq||{})[i] || S.gymPref[g+':'+i] || S.settings.equip; }
function todayExercises(){
  const g=todayGate(); if(g==='rest') return [];
  if(gymDay(g)) return GYM[g].slots.map((sl,i)=>{ const eq=slotEquip(g,i), [id,t,note]=sl[eq];
    return Object.assign({id, t, note, eq, name:EX[id].n, d:EX[id].d}, parseT(t)); });
  return GATES[g].tiers[tier()].map(([id,t,note,name])=>Object.assign({id, t, note, name:name||EX[id].n, d:EX[id].d}, parseT(t)));
}
function setsFor(ei, ex){
  // si el ejercicio de este hueco ha cambiado (mancuernas ↔ máquina), se rellenan de nuevo
  if(S.day.sets[ei] && S.day.sid[ei] && S.day.sid[ei]!==ex.id){ delete S.day.sets[ei]; delete S.day.up[ei]; }
  if(!S.day.sets[ei]){
    S.day.sid[ei]=ex.id;
    const last=S.last[ex.id]||[];
    // si la última vez llegaste al máximo de reps en todas las series, se avisa de subir peso (pero no se sube solo)
    const up = last.length>=ex.sets && last.every(q=>q.reps>=ex.rmax) && last[0].kg>0;
    S.day.sets[ei]=Array.from({length:ex.sets},(_,i)=>{ const l=last[i]||last[last.length-1];
      if(!l) return {kg:0, reps:ex.rmin, done:false};
      return {kg:l.kg, reps:l.reps, done:false}; });
    if(up) S.day.up[ei]=true;
  }
  return S.day.sets[ei];
}
function totals(){ const exs=todayExercises(); let done=0, all=0; exs.forEach((ex,i)=>{ const ss=setsFor(i,ex); all+=ss.length; done+=ss.filter(s=>s.done).length; }); return {done, all}; }

function pickGate(g){
  if(S.day.done) return;
  const anyDone=Object.values(S.day.sets).some(ss=>ss.some(s=>s.done));
  if(anyDone && !confirm('Ya has marcado series de hoy. Si cambias de entreno se borrarán. ¿Cambiar?')) return;
  S.day.gate=g; S.day.sets={}; S.day.sid={}; S.day.up={}; S.day.eq={}; S.day.start=null; stopRest(); save(); render();
}
function setPlace(v){
  if(S.settings.place===v) return;
  const anyDone=!S.day.done && Object.values(S.day.sets).some(ss=>ss.some(s=>s.done));
  if(anyDone && !confirm('Ya has marcado series de hoy. Si cambias se borrarán. ¿Cambiar?')) return;
  S.settings.place=v;
  if(!S.day.done){ S.day.sets={}; S.day.sid={}; S.day.up={}; S.day.eq={}; S.day.start=null; stopRest(); }
  save(); render();
}
function setEquip(v){
  // los ejercicios que ya has empezado hoy se quedan con la versión con la que los empezaste
  const g=todayGate();
  if(gymDay(g)){ S.day.eq=S.day.eq||{}; GYM[g].slots.forEach((_,i)=>{ if(slotStarted(i)) S.day.eq[i]=slotEquip(g,i); }); }
  S.settings.equip=v; S.gymPref={}; save(); render();
}
function swapEx(ei){
  const g=todayGate();
  if(slotStarted(ei)){ toast('Ya has hecho series de este ejercicio'); return; }
  const eq=slotEquip(g,ei)==='db'?'mq':'db';
  if(S.day.eq) delete S.day.eq[ei];
  if(eq===S.settings.equip) delete S.gymPref[g+':'+ei]; else S.gymPref[g+':'+ei]=eq;
  save(); render();
}
function adj(ei,si,field,dir){
  const ex=todayExercises()[ei], ss=setsFor(ei,ex), s=ss[si];
  if(field==='kg'){ const step=+S.settings.step; changeKg(ss,si,Math.max(0, Math.round((s.kg+dir*step)*100)/100)); }
  else s.reps=Math.max(0, s.reps+dir);
  save(); render();
}
function changeKg(ss,si,v){
  const old=ss[si].kg; ss[si].kg=v;
  // al cambiar el peso de una serie, las siguientes que aún no has hecho se ajustan solas
  for(let j=si+1;j<ss.length;j++){ if(!ss[j].done && ss[j].kg===old) ss[j].kg=v; }
}
function setVal(ei,si,field,val){
  const ex=todayExercises()[ei], ss=setsFor(ei,ex);
  const v=parseFloat(String(val).replace(',','.'));
  if(isNaN(v)||v<0){ render(); return; }
  if(field==='kg') changeKg(ss,si,Math.round(v*100)/100); else ss[si].reps=Math.round(v);
  save(); render();
}
function toggleSet(ei,si){
  if(S.day.done) return;
  ensureAudio();
  const exs=todayExercises(), ex=exs[ei], ss=setsFor(ei,ex), s=ss[si];
  s.done=!s.done;
  if(s.done && !S.day.start) S.day.start=Date.now(); // el cronómetro empieza con la primera serie
  if(s.done){
    const prev=S.best[ex.id]||0;
    if(s.kg>prev && prev>0 && !S.day.prToast?.[ex.id]){ S.day.prToast=Object.assign({},S.day.prToast,{[ex.id]:1}); toast(`🏆 ¡Récord en ${EX[ex.id].n}: ${fmtKg(s.kg)} kg!`); }
    const t=totals();
    if(t.done<t.all) startRest(); else { stopRest(); toast('¡Todas las series hechas! Pulsa «Terminar» 🎉'); }
  }
  save(); render();
}
function toggleInfo(ei){ S.day.openInfo[ei]=!S.day.openInfo[ei]; render(); }

function finishWorkout(){
  const exs=todayExercises(), t=totals();
  if(t.done===0){ toast('Marca al menos una serie ✓'); return; }
  if(t.done<t.all && !confirm(`Llevas ${t.done} de ${t.all} series. ¿Terminar igualmente? Recibirás la parte proporcional.`)) return;
  const frac=t.done/t.all;
  const entry={id:uid(), date:S.day.date, gate:todayGate(), tier:tier(), exercises:[]};
  if(gymDay(entry.gate)) entry.gym=true;
  if(S.day.start) entry.secs=Math.round((Date.now()-S.day.start)/1000);
  exs.forEach((ex,i)=>{
    const done=setsFor(i,ex).filter(s=>s.done).map(s=>({kg:s.kg, reps:s.reps}));
    if(done.length){
      entry.exercises.push({id:ex.id, name:ex.name, sets:done});
      S.last[ex.id]=done;
      S.best[ex.id]=Math.max(S.best[ex.id]||0, ...done.map(s=>s.kg));
    }
  });
  S.log.push(entry);
  const xp=Math.round(REWARD.workout.xp*frac), corn=Math.max(1,Math.round(REWARD.workout.corn*frac));
  const got=addCorn(corn); addXp(xp);
  S.day.done=true; S.day.partial=frac<1?frac:0; S.day.gate=entry.gate; S.day.gym=!!entry.gym;
  S.cycle=(S.cycle+1)%CYCLE.length;
  markActive(); stopRest();
  giftIfStuck();
  save(); render();
  const cd=entry.gym && CARDIO[entry.gate];
  const extraBtn = cd ? `<button class="btn warm" onclick="closeModal();startCardio()">${cd.e} Cardio extra: ${cd.n} (~${cardioMins(cd)} min)</button><div style="height:8px"></div>`
    : (S.settings.finisher&&!S.day.finisher) ? '<button class="btn warm" onclick="closeModal();startFinisher()">🔥 Circuito quemagrasa (~9 min)</button><div style="height:8px"></div>' : '';
  showModal(`<div style="text-align:center;font-size:56px">🐔🎉</div><h2 style="text-align:center">¡Entreno terminado!</h2>
    <p class="sub" style="text-align:center">${entry.secs?`⏱ Has entrenado <b>${fmtDur(entry.secs)}</b> · `:''}+${xp} XP · +${got} 🌽 de maíz para la granja</p>
    <p class="sub" style="text-align:center">Ahora toca estirar: tus músculos te lo agradecerán.</p>
    ${extraBtn}<button class="btn ${extraBtn?'sec':''}" onclick="closeModal();startStretch()">🧘 Empezar estiramientos</button>
    <div style="height:8px"></div><button class="btn ghost" onclick="closeModal()">Más tarde</button>`);
}
/* ---------- Descanso olvidado: apuntar el de ayer ---------- */
function yesterdayMissing(){
  const t=today(), y=addDays(t,-1);
  if(!S.created || S.created>y || S.retroRest===t) return false;
  if(S.lastActive===t) return S.prevActive ? S.prevActive.date!==y : S.streak===1;
  return S.lastActive!==y;
}
function retroRest(){
  if(!yesterdayMissing()) return;
  const t=today(), y=addDays(t,-1), y2=addDays(t,-2);
  // racha hasta ayer, contando el descanso de ayer
  const base = S.lastActive===t ? (S.prevActive||{date:null, streak:0}) : {date:S.lastActive, streak:S.streak};
  const sy = base.date===y2 ? base.streak+1 : 1;
  if(S.lastActive===t){ S.streak=sy+1; S.prevActive={date:y, streak:sy}; }
  else { S.streak=sy; S.lastActive=y; }
  S.bestStreak=Math.max(S.bestStreak||0, S.streak);
  // si hoy la app te proponía el descanso pendiente, pasa al siguiente entreno
  if(!S.day.done && !S.day.rest && !S.day.gate && nextGate()==='rest') S.cycle=(S.cycle+1)%CYCLE.length;
  S.retroRest=t;
  S.hist[y]=Object.assign(S.hist[y]||{}, {rest:true});
  const got=addCorn(REWARD.rest.corn); addXp(REWARD.rest.xp);
  save(); render();
  toast(`🌾 Descanso de ayer apuntado · +${got} 🌽 · racha ${S.streak}`);
}
function confirmRest(){
  if(S.day.rest) return;
  S.day.rest=true;
  const got=addCorn(REWARD.rest.corn); addXp(REWARD.rest.xp);
  if(todayGate()==='rest'){ S.day.gate='rest'; S.cycle=(S.cycle+1)%CYCLE.length; }
  markActive(); save(); render();
  toast(`Descanso registrado 🌾 +${got} 🌽`);
}
function giftIfStuck(){
  const layers=S.animals.filter(a=>SPECIES[a.type].lay>0).length;
  const cheapest=Math.min(...Object.values(SPECIES).map(s=>s.cost));
  if(layers===0 && S.eggs<cheapest){
    const name=HEN_NAMES[hash(S.day.date)%HEN_NAMES.length];
    S.animals.push({id:uid(), type:'pita', name, sat:100, starve:0, since:today()});
    setTimeout(()=>showModal(`<div style="text-align:center;font-size:56px">🧺🐔</div><h2 style="text-align:center">¡Un regalo!</h2><p class="sub" style="text-align:center">Una vecina ha visto lo mucho que entrenas y te regala una gallina: <b>${esc(name)}</b>. ¡Cuídala bien!</p><button class="btn" onclick="closeModal()">Gracias</button>`),1200);
  }
}

/* ---------- Temporizador de descanso entre series ---------- */
let REST=null;
function startRest(){
  stopRest();
  REST={total:+S.settings.rest, left:+S.settings.rest};
  REST.timer=setInterval(()=>{
    REST.left--;
    if(REST.left<=3 && REST.left>0) beep(660,.07);
    if(REST.left<=0){ beep(990,.25); vibrate([120,60,120]); stopRest(); return; }
    drawRest();
  },1000);
  drawRest();
}
function stopRest(){ if(REST){ clearInterval(REST.timer); REST=null; } drawRest(); }
function restAdd(n){ if(!REST) return; REST.left=Math.max(1,REST.left+n); REST.total=Math.max(REST.total,REST.left); drawRest(); }
function drawRest(){
  const el=document.getElementById('restbar');
  if(!REST || currentTab!=='home'){ el.innerHTML=''; return; }
  const m=Math.floor(REST.left/60), s=String(REST.left%60).padStart(2,'0');
  el.innerHTML=`<div class="rest"><span class="tm">${m}:${s}</span><span class="lb">Descansa 😮‍💨</span>

/* ---------- Sonido y vibración ---------- */
let AC=null;
function ensureAudio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(f=880,d=.12){
  try{ if(!AC) return; const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(.25,AC.currentTime+.01); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d+.02); }catch(e){}
}
function vibrate(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- Reproductor guiado (estiramientos y Kegel) ---------- */
let P=null, wakeLock=null;
function startPlayer(title, steps, onDone){
  ensureAudio();
  P={title, steps, i:0, left:steps[0].secs, paused:false, onDone};
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{}); }catch(e){}
  drawPlayer(); cueStep();
  P.timer=setInterval(()=>{
    if(!P || P.paused) return;
    P.left--;
    const st=P.steps[P.i];
    if(st.secs>=10 && P.left<=3 && P.left>0) beep(600,.06);
    if(P.left<=0) stepTo(P.i+1); else drawPlayer();
  },1000);
}
function cueStep(){ const st=P.steps[P.i]; if(st.kind==='squeeze'){ beep(880,.12); vibrate(60); } else if(st.kind==='relax'||st.kind==='rest'){ beep(440,.15); vibrate(40); } else { beep(760,.18); vibrate(80); } }
function stepTo(i){
  if(!P) return;
  if(i>=P.steps.length){ const cb=P.onDone; closePlayer(); cb&&cb(); return; }
  P.i=Math.max(0,i); P.left=P.steps[P.i].secs; cueStep(); drawPlayer();
}
function togglePause(){ if(!P) return; P.paused=!P.paused; drawPlayer(); }
function closePlayer(){ if(P){ clearInterval(P.timer); P=null; } try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock=null; document.getElementById('overlay').innerHTML=''; }
function quitPlayer(){ if(confirm('¿Salir? No se contará como hecho.')) closePlayer(); }
function drawPlayer(){
  if(!P) return;
  const st=P.steps[P.i], nx=P.steps[P.i+1];
  const C=2*Math.PI*100, frac=st.secs?P.left/st.secs:0;
  const isK=st.kind==='squeeze'||st.kind==='relax';
  const color = (st.kind==='relax'||st.kind==='rest') ? 'var(--straw)' : st.kind==='work' ? 'var(--comb)' : 'var(--sage)';
  const totalLeft=P.steps.slice(P.i+1).reduce((a,s)=>a+s.secs,0)+P.left;
  document.getElementById('overlay').innerHTML=`<div class="player">
    <div class="ptop"><button class="btn ghost small" onclick="quitPlayer()">✕</button><div class="sp" style="text-align:center;font-weight:800">${esc(P.title)}</div><span class="tiny" style="min-width:44px;text-align:right">${Math.floor(totalLeft/60)}:${String(totalLeft%60).padStart(2,'0')}</span></div>
    <div class="progress-line" style="max-width:560px;width:100%;margin:12px auto 0"><i style="width:${100*P.i/P.steps.length}%"></i></div>
    <div class="pmain">
      <div class="ring ${isK?st.kind:''}">
        ${isK?'<div class="blob"></div>':''}
        <svg viewBox="0 0 220 220"><circle cx="110" cy="110" r="100" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle cx="110" cy="110" r="100" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}" style="transition:stroke-dashoffset 1s linear"/></svg>
        <div class="num">${P.left}</div>
      </div>
      <div class="p-title">${esc(st.title)}</div>
      ${st.sub?`<div class="p-sub">${esc(st.sub)}</div>`:''}
      ${nx?`<div class="p-next">Después: ${esc(nx.title)}</div>`:''}
    </div>
    <div class="pctl">
      <button class="btn ghost" onclick="stepTo(P.i-1)" ${P.i===0?'disabled':''}>⏮</button>
      <button class="btn ${P.paused?'':'sec'}" onclick="togglePause()">${P.paused?'▶ Seguir':'⏸ Pausa'}</button>
      <button class="btn ghost" onclick="stepTo(P.i+1)">⏭</button>
    </div></div>`;
}

function wAdj(n){ WDRAFT=Math.max(20,Math.round(((WDRAFT??lastWeight()??65)+n)*10)/10); const el=document.getElementById('wval'); if(el) el.value=fmtKg(WDRAFT); }

/* Media móvil de 7 días: suaviza los cambios de agua del día a día */
function weightSeries(){
  const d=Object.keys(S.weights).sort();
  return d.map(date=>{ const win=d.filter(x=>daysBetween(x,date)>=0&&daysBetween(x,date)<7); const avg=win.reduce((a,x)=>a+S.weights[x],0)/win.length; return {date, w:S.weights[date], avg}; });
}
/* Ritmo semanal: pendiente (regresión lineal) de las últimas 3 semanas */
function weeklyRate(){
  const t=today(), d=Object.keys(S.weights).sort().filter(x=>daysBetween(x,t)<=21);
  if(d.length<4 || daysBetween(d[0],d[d.length-1])<7) return null;
  const xs=d.map(x=>daysBetween(d[0],x)), ys=d.map(x=>S.weights[x]);
  const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
  const kg=slope*7; return {kg, pct:kg/my*100};
}
function goalAdvice(){
  const goal=S.settings.goal, g=GOALS[goal]; if(!g) return null;
  const r=weeklyRate();
  if(!r) return {lvl:'', msg:'Pésate unos cuantos días durante una semana y aquí verás si vas al ritmo adecuado para tu objetivo.'};
  const [lo,hi]=g.rate;
  if(r.pct<lo) return goal==='lose'
    ? {lvl:'red', msg:'Estás bajando muy rápido: come un poco más (unas 200 kcal) para no perder músculo.'}
    : {lvl:'red', msg:'Estás bajando de peso: añade unas 200-300 kcal al día (un puñado de frutos secos, un yogur, un plátano...).'};
  if(r.pct>hi) return goal==='gain'
    ? {lvl:'red', msg:'Subes rápido: parte será grasa. Recorta un poco (unas 150 kcal al día).'}
    : {lvl:'red', msg: goal==='lose' ? 'El peso no baja: recorta unas 200 kcal al día o camina más.' : 'Estás subiendo de peso: recorta un poco (unas 200 kcal al día).'};
  return {lvl:'green', msg:'¡Vas al ritmo ideal! Sigue así 👏'};
}

  if(S.corn<1){ toast('No te queda maíz. ¡Entrena para conseguir más! 💪'); return; }
  S.corn--; a.sat=Math.min(100,a.sat+SPECIES[a.type].feed); a.starve=0;
  save(); render();
}
function feedCost(){ return S.animals.reduce((c,a)=>c+Math.ceil((100-a.sat)/SPECIES[a.type].feed),0); }
function feedAll(){
  if(S.corn<1){ toast('No te queda maíz. ¡Entrena para conseguir más! 💪'); return; }
  let used=0, guard=0;
  while(S.corn>0 && guard++<500){
    const a=S.animals.filter(x=>x.sat<100).sort((x,y)=>x.sat-y.sat)[0];
    if(!a) break;
    S.corn--; used++; a.sat=Math.min(100,a.sat+SPECIES[a.type].feed); a.starve=0;
  }
  save(); render();
  toast(used?`🌽 Has repartido ${used} de maíz`:'Todos están llenos 😊');
}
function collectEgg(id){ const i=S.pendingEggs.findIndex(e=>e.id===id); if(i<0) return; S.pendingEggs.splice(i,1); S.eggs++; save(); render(); }
function collectAll(){ const n=S.pendingEggs.length; if(!n) return; S.eggs+=n; S.pendingEggs=[]; save(); render(); toast(`🧺 +${n} ${plural(n,'huevo','huevos')}`); }
function buy(type){
  const sp=SPECIES[type], lvl=levelFromXp(S.xp).lvl;
  if(lvl<sp.lvl){ toast(`Se desbloquea en el nivel ${sp.lvl}`); return; }
  if(S.eggs<sp.cost){ toast(`Te faltan ${sp.cost-S.eggs} 🥚`); return; }
  const used=new Set(S.animals.map(a=>a.name));
  const sug=HEN_NAMES.find(n=>!used.has(n))||'Gallinita';
  showModal(`<div style="display:flex;justify-content:center">${animalArt(type,null,96)}</div>
    <h2 style="text-align:center">${esc(sp.n)}</h2><p class="sub" style="text-align:center">${esc(sp.d)} Cuesta ${sp.cost} 🥚.</p>
    <input type="text" id="nm" maxlength="20" value="${esc(sug)}" placeholder="Nombre">
    <button class="btn" onclick="doBuy('${type}')">Comprar y llevar a la granja</button><div style="height:8px"></div>
    <button class="btn ghost" onclick="closeModal()">Cancelar</button>`);
}
function doBuy(type){
  const sp=SPECIES[type]; if(S.eggs<sp.cost) return;
  const name=(document.getElementById('nm').value||'').trim()||sp.n;
  S.eggs-=sp.cost; S.animals.push({id:uid(), type, name, sat:100, starve:0, since:today()});
  closeModal(); save(); render(); toast(`🎉 ¡${name} ya vive en tu granja!`);
}
function animalSheet(id){
  const a=S.animals.find(x=>x.id===id); if(!a) return;
  const sp=SPECIES[a.type];
  const days=daysBetween(a.since,today());
  const left = a.sat>0 ? Math.ceil(a.sat/DECAY)+STARVE_DAYS : STARVE_DAYS-(a.starve||0);
  const owned=Object.keys(ACCESSORIES).filter(accOwned);
  showModal(`<div style="display:flex;justify-content:center">${animalArt(a.type,a.acc,110)}</div>
    <h2 style="text-align:center">${esc(a.name)}</h2>
    <p class="sub" style="text-align:center">${esc(sp.n)} · en tu granja desde hace ${days} ${plural(days,'día','días')}</p>
    ${hungerBar(a)}
    <p class="sub" style="margin-top:10px">${sp.lay?`Si su saciedad está al ${LAY_MIN}% o más, pone ${sp.lay} 🥚 al día.`:'Es una mascota: no pone huevos.'} ${a.sat<=0?`<b style="color:#B4412E">¡Está muy débil! Si no come, le quedan ${left} ${plural(left,'día','días')}.</b>`:`Sin comer aguantaría unos ${left} días.`}</p>
    ${sp.art?`<div class="tiny" style="margin-top:12px;font-weight:800">ACCESORIO</div>
      ${owned.length?`<div class="acc-pick"><button class="${!a.acc?'on':''}" onclick="setAcc('${a.id}','')">${henSvg(sp.art,null,40)}<span>Nada</span></button>${owned.map(k=>`<button class="${a.acc===k?'on':''}" onclick="setAcc('${a.id}','${k}')">${henSvg(sp.art,k,40)}<span>${esc(ACCESSORIES[k].n)}</span></button>`).join('')}</div>`
      :`<p class="tiny" style="margin:4px 0 0">Aún no tienes accesorios. Cómpralos en el Armario de la granja 👒</p>`}`:''}
    <input type="text" id="nm" maxlength="20" value="${esc(a.name)}" placeholder="Nombre">
    <div class="row"><button class="btn" onclick="feedOne('${a.id}');animalSheet('${a.id}')" ${a.sat>=100?'disabled':''}>🌽 Dar maíz (+${sp.feed}%)</button>
    <button class="btn sec" style="width:auto" onclick="renameAnimal('${a.id}')">Guardar nombre</button></div>
    <div style="height:8px"></div><button class="btn ghost" onclick="closeModal()">Cerrar</button>`, true);
}
function setAcc(id,k){ const a=S.animals.find(x=>x.id===id); if(!a) return; a.acc=k||null; save(); render(); animalSheet(id); }
function buyAcc(k){
  const ac=ACCESSORIES[k];
  if(accOwned(k)){ toast('Ya lo tienes: pónselo desde la ficha de una gallina'); return; }
  if(ac.streak){ toast(`Se gana con una racha de ${ac.streak} días 🔥`); return; }
  if(S.eggs<ac.cost){ toast(`Te faltan ${ac.cost-S.eggs} 🥚`); return; }
  S.eggs-=ac.cost; S.owned=(S.owned||[]).concat(k); save(); render();
  toast(`👒 ¡${ac.n} en tu armario! Toca una gallina para ponérselo`);
}
function renameAnimal(id){ const a=S.animals.find(x=>x.id===id); const v=(document.getElementById('nm').value||'').trim(); if(a&&v){ a.name=v; save(); render(); closeModal(); toast('Nombre guardado'); } }
function hungerBar(a){
  const c=a.sat>50?'var(--sage)':a.sat>20?'var(--straw)':'var(--comb)';
  const lbl=a.sat>=80?'Llena':a.sat>50?'Contenta':a.sat>20?'Con hambre':a.sat>0?'Mucha hambre':'¡Sin fuerzas!';
  return `<div class="row tiny" style="margin-top:6px"><span>Saciedad · ${lbl}</span><span class="sp"></span><b style="color:var(--ink2)">${a.sat}%</b></div><div class="hbar"><i style="width:${Math.max(3,a.sat)}%;background:${c}"></i></div>`;
}

/* ---------- Modales y avisos ---------- */
let MQ=[];
function showModal(html, force){
  const ov=document.getElementById('overlay');
  if(P || (!force && ov.querySelector('.modal'))){ MQ.push(html); return; }
  ov.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ if(P) return; const ov=document.getElementById('overlay'); ov.innerHTML=''; if(MQ.length) setTimeout(()=>showModal(MQ.shift()),150); }
function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  const box=document.getElementById('toasts'); box.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); },2600);
}

/* ---------- Render ---------- */
let currentTab='home', chartEx=null, PF={day:'all', eq:'all'}; // filtros del selector de ejercicios
/* A qué día (empuje/tirón/pierna) y material pertenece cada ejercicio, según dónde sale en las rutinas */
let EX_CAT=null;
function exCat(id){
  if(!EX_CAT){
    EX_CAT={};
    ['push','pull','legs'].forEach(g=>{
      GATES[g].tiers.flat().forEach(([x])=>{ EX_CAT[x]=EX_CAT[x]||{day:g, eq:'db'}; });
      GYM[g].slots.forEach(sl=>{ EX_CAT[sl.db[0]]=EX_CAT[sl.db[0]]||{day:g, eq:'db'}; EX_CAT[sl.mq[0]]={day:g, eq:'mq'}; });
    });
  }
  return EX_CAT[id]||{day:'other', eq:'db'};
}
// valor de una sesión para comparar: kg × reps de todas las series (o reps si va sin peso)
function sessionVal(r, byReps){ return byReps ? r.sets.reduce((a,s)=>a+s.reps,0) : r.vol; }
function exPicker(ids){
  const lastDate={}; S.log.forEach(e=>e.exercises.forEach(x=>{ if(!lastDate[x.id]||e.date>lastDate[x.id]) lastDate[x.id]=e.date; }));
  const shown=ids.filter(id=>(PF.day==='all'||exCat(id).day===PF.day) && (PF.eq==='all'||exCat(id).eq===PF.eq))
    .sort((a,b)=>lastDate[b].localeCompare(lastDate[a]));
  if(shown.length && !shown.includes(chartEx)) chartEx=shown[0];
  const segF=(key,opts)=>`<div class="seg full">${opts.map(([k,l])=>`<button class="${PF[key]===k?'on':''}" onclick="PF.${key}='${k}';render()">${l}</button>`).join('')}</div>`;
  let h=segF('day',[['all','Todos'],['push','💪 Empuje'],['pull','🪣 Tirón'],['legs','🦵 Pierna']])
    + segF('eq',[['all','Todo'],['db','💪 Mancuernas'],['mq','🏋️ Máquinas']]);
  if(!shown.length) return h+`<p class="sub" style="margin:4px 0 0">Todavía no has hecho ningún ejercicio de este tipo.</p>`;
  return h+`<div class="exlist">${shown.map(id=>{
    const hs=exerciseHistory(id), br=hs.every(r=>r.vol===0);
    const p = hs.length>1 && sessionVal(hs[hs.length-2],br)>0 ? Math.round(100*(sessionVal(hs[hs.length-1],br)-sessionVal(hs[hs.length-2],br))/sessionVal(hs[hs.length-2],br)) : null;
    return `<button class="exb ${id===chartEx?'on':''}" onclick="chartEx='${id}';render()">${esc(EX[id].n)}<small class="${p>0?'up':p<0?'down':''}">${p==null?'1 sesión':(p>0?'▲ +':p<0?'▼ ':'= ')+p+' %'} · ${fmtDate(lastDate[id])}</small></button>`;
  }).join('')}</div>`;
}
function switchTab(t){ currentTab=t; render(); window.scrollTo(0,0); }

function viewHome(){
  const g=todayGate(), next=nextGate();
  let h='';
  if(S.news.length){
    h+=`<div class="card news"><div class="row"><h3>Mientras no estabas…</h3><span class="sp"></span><button class="btn ghost small" onclick="S.news=[];save();render()">OK</button></div><ul class="clean sub">${S.news.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  }
  const weak=S.animals.filter(a=>a.sat<=0);
  if(weak.length){
    h+=`<div class="card alert"><h3>🚨 ${weak.map(a=>esc(a.name)).join(', ')} ${weak.length>1?'se han quedado sin fuerzas':'se ha quedado sin fuerzas'}</h3><p class="sub" style="margin:4px 0 10px">Si no comen pronto, morirán. Entrena para conseguir maíz y dales de comer.</p><button class="btn warm small" onclick="switchTab('farm')">Ir a la granja</button></div>`;
  }

  if(yesterdayMissing()){
    h+=`<div class="card"><div class="row"><div><h3>🌾 ¿Ayer descansaste?</h3><div class="sub">Si se te olvidó apuntarlo, hazlo ahora y no pierdes la racha.</div></div></div>
      <div style="height:10px"></div><div class="row" style="gap:8px"><button class="btn small" style="flex:1" onclick="retroRest()">Apuntar descanso de ayer · +${REWARD.rest.corn} 🌽</button><button class="btn ghost small" style="width:auto" onclick="S.retroRest=today();save();render()">No</button></div></div>`;
  }

  // --- Entreno ---
  h+=`<div class="card"><div class="seg full">${[['home','🏠 En casa'],['gym','🏢 Gimnasio']].map(([k,l])=>`<button class="${S.settings.place===k?'on':''}" onclick="setPlace('${k}')">${l}</button>`).join('')}</div>
    <div class="chips">${['push','pull','legs','rest'].map(k=>`<button class="chip ${g===k?'on':''} ${k===next&&g!==k?'next':''}" onclick="pickGate('${k}')" ${S.day.done?'disabled':''}><span class="ci">${k==='rest'?'🌾':GATES[k].icon}</span>${DAY_LABEL[k]}</button>`).join('')}</div>`;
  if(g==='rest'){
    h+=`<div style="text-align:center;padding:16px 0 4px"><div style="font-size:54px">🌾</div><h2>Día de descanso</h2>
      <p class="sub">Tus músculos crecen descansando. Confirma el descanso para mantener la racha, y si te apetece haz una sesión de movilidad suave.</p></div>
      ${S.day.rest?`<div class="badge green" style="display:flex;justify-content:center;padding:10px">✓ Descanso registrado</div>`:`<button class="btn" onclick="confirmRest()">Confirmar descanso · +${REWARD.rest.corn} 🌽</button>`}
      <p class="tiny" style="text-align:center;margin-top:10px">¿Prefieres entrenar? Elige Empuje, Tirón o Pierna arriba.</p>`;
  } else {
    const G=GATES[g], GD=gymDay(g), exs=todayExercises(), t=totals();
    const doneSecs=(S.log.find(e=>e.date===S.day.date&&e.secs)||{}).secs;
    h+=`<div class="row" style="margin-top:10px"><div><h2>${G.icon} ${G.name}</h2><div class="sub">${GD?GD.sub:G.sub}</div></div><span class="sp"></span><span class="badge">${GD?'🏢 Gimnasio':RANKS[tier()].e+' '+RANKS[tier()].n}</span></div>
      <div class="progress-line"><i style="width:${100*t.done/t.all}%"></i></div>
      ${S.day.start&&!S.day.done?'<div class="tiny" id="wclock" style="margin-top:4px;font-weight:800;color:var(--sage-dark)"></div>':''}
      ${S.day.done&&doneSecs?`<div class="tiny" style="margin-top:4px;font-weight:800;color:var(--sage-dark)">⏱ Entrenaste ${fmtDur(doneSecs)}</div>`:''}
      <div class="tiny" style="margin-top:4px">${t.done} de ${t.all} series · ${GD?'mancuernas: peso de cada una · máquinas: el que marca la máquina':'peso por mancuerna'}</div>`;
    if(GD && !S.day.done) h+=`<div class="seg full" style="margin:12px 0 0">${Object.entries(EQUIP).map(([k,q])=>`<button class="${S.settings.equip===k?'on':''}" onclick="setEquip('${k}')">${q.e} ${q.n}</button>`).join('')}</div>`;
    if(S.day.done){
      h+=`<div class="badge green" style="display:flex;justify-content:center;padding:10px;margin-top:12px;font-size:14px">✓ Entreno completado${S.day.partial?' (parcial)':''} · ¡bien hecho!</div>`;
    } else {
      h+=`<details class="wu"><summary>🔥 Calentamiento <span class="tiny">(${GD?'7-8':'2-3'} min)</span></summary>${(GD?GD.warm:WARMUPS[g]).map(([n,t])=>`<div class="wu-item"><span>${esc(n)}</span><b style="white-space:nowrap">${esc(t)}</b></div>`).join('')}</details>`;
    }
    exs.forEach((ex,ei)=>{
      const ss=setsFor(ei,ex), complete=ss.every(s=>s.done);
      const last=S.last[ex.id], best=S.best[ex.id];
      const reps = ex.rmin===ex.rmax?ex.rmin:`${ex.rmin}-${ex.rmax}`;
      const per = /\/lado/.test(ex.t)?' por lado':/\/pierna/.test(ex.t)?' por pierna':'';
      h+=`<div class="ex ${complete?'complete':''}">
        <div class="ex-head"><div class="ex-num">${complete?'✓':ei+1}</div>

          ${S.day.up[ei]&&!S.day.done?`<div class="ex-up">⬆️ La última vez llegaste al máximo de repeticiones en todas las series: deberías subir el peso. Súbelo tú con + si te ves con fuerza.</div>`:''}
          ${last?`<div class="ex-last">Última vez: ${last.map(s=>fmtKg(s.kg)+'×'+s.reps).join(' · ')}${best?` · 🏆 ${fmtKg(best)} kg`:''}</div>`:`<div class="ex-last">Primera vez: elige un peso con el que llegues justo al rango de repeticiones.</div>`}</div>
          <button class="info-btn" onclick="toggleInfo(${ei})" aria-label="Cómo se hace">?</button></div>
        ${S.day.openInfo[ei]?`<div class="ex-desc">${esc(ex.d)}</div>`:''}

        ${ss.map((s,si)=>`<div class="set ${s.done?'done':''}"><span class="sn">${si+1}</span>
          <div class="stp"><button onclick="adj(${ei},${si},'kg',-1)" ${S.day.done?'disabled':''}>−</button><label><input type="text" inputmode="decimal" value="${fmtKg(s.kg)}" onfocus="this.select()" onchange="setVal(${ei},${si},'kg',this.value)" ${S.day.done?'disabled':''}></label><button onclick="adj(${ei},${si},'kg',1)" ${S.day.done?'disabled':''}>+</button></div>
          <div class="stp"><button onclick="adj(${ei},${si},'reps',-1)" ${S.day.done?'disabled':''}>−</button><label><input type="text" inputmode="numeric" value="${s.reps}" onfocus="this.select()" onchange="setVal(${ei},${si},'reps',this.value)" ${S.day.done?'disabled':''}></label><button onclick="adj(${ei},${si},'reps',1)" ${S.day.done?'disabled':''}>+</button></div>
          <button class="chk" onclick="toggleSet(${ei},${si})" aria-label="Serie hecha">✓</button></div>`).join('')}
        </div></div>`;
    });
    if(!S.day.done) h+=`<div style="height:14px"></div><button class="btn" onclick="finishWorkout()">Terminar entrenamiento · +${REWARD.workout.corn} 🌽</button>`;
  }
  h+=`</div>`;

  // --- Músculos ---
  if(g!=='rest' || Object.keys(muscleScores(MRANGE)).length) h+=musclesCard();

  // --- Cardio extra (gimnasio) ---
  const cd=g!=='rest' && gymDay(g) && CARDIO[g];
  if(cd){
    h+=`<div class="card"><div class="row"><div><h3>${cd.e} Cardio extra · ${cd.n}</h3><div class="sub">Opcional, al acabar las pesas · unos ${cardioMins(cd)} min${S.settings.goal==='lose'?' · recomendado para tu objetivo':''}</div></div><span class="sp"></span>${S.day.cardio?'<span class="badge green">✓ Hecho</span>':''}</div>
      <p class="sub" style="margin:8px 0 0">${esc(cd.d)}</p>
      <details class="wu"><summary>Ver el plan</summary>${(cd.plan||cd.steps).map(([n,d,secs])=>`<div class="wu-item"><span>${esc(n)}<br><span class="tiny">${esc(d)}</span></span><b style="white-space:nowrap">${Math.round(secs/60)} min</b></div>`).join('')}</details>
      <div style="height:12px"></div><button class="btn ${S.day.cardio?'sec':'warm'}" onclick="startCardio()">${S.day.cardio?'Repetir cardio':`Empezar cardio · +${REWARD.cardio.corn} 🌽`}</button></div>`;
  }

  // --- Circuito quemagrasa ---
  if(S.settings.finisher && g!=='rest' && !gymDay(g)){
    const fm=Math.round(finisherSteps().reduce((a,s)=>a+s.secs,0)/60);
    h+=`<div class="card"><div class="row"><div><h3>🔥 Circuito quemagrasa</h3><div class="sub">${finisherRounds()} rondas · 4 ejercicios · unos ${fm} min · al acabar las pesas</div></div><span class="sp"></span>${S.day.finisher?'<span class="badge green">✓ Hecho</span>':''}</div>
      <details class="wu"><summary>Ver ejercicios</summary>${FINISHER.map(([n])=>`<div class="wu-item"><span>${esc(n)}</span><b>30 s</b></div>`).join('')}</details>
      <div style="height:12px"></div><button class="btn ${S.day.finisher?'sec':'warm'}" onclick="startFinisher()">${S.day.finisher?'Repetir circuito':`Empezar circuito · +${REWARD.finisher.corn} 🌽`}</button></div>`;
  }

  // --- Estiramientos ---
  const sg=stretchGate(), st=STRETCHES[sg];

/* ---------- Calendario: qué hiciste cada día ---------- */
let CAL=null; // mes que se está viendo, 'AAAA-MM'
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtDur(secs){ const m=Math.round(secs/60); return m<60 ? m+' min' : Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')+' min'; }
function archiveDay(d){

function dayExtras(ds){ if(ds!==S.day.date) return S.hist[ds]||{}; const d=S.day; return {rest:d.rest, stretch:d.stretch, cardio:d.cardio, finisher:d.finisher, kegel:d.kegel.filter(Boolean).length}; }
function calMove(n){ const [y,m]=(CAL||today().slice(0,7)).split('-').map(Number); const d=new Date(y,m-1+n,1); CAL=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); render(); }
function dayInProgress(ds){ return ds===S.day.date && !S.day.done && Object.values(S.day.sets).some(ss=>ss.some(s=>s.done)); }
function calendarCard(){

function delLog(id){
  if(!confirm('¿Borrar este entreno del historial? (El maíz y la XP que ganaste se quedan.)')) return;
  S.log=S.log.filter(e=>e.id!==id);
  // recalcula último peso y récord a partir de lo que queda
  S.last={}; S.best={};
  S.log.forEach(e=>e.exercises.forEach(x=>{ S.last[x.id]=x.sets; S.best[x.id]=Math.max(S.best[x.id]||0,...x.sets.map(s=>s.kg)); }));
  save(); render();
}

/* Gráfico de una sola serie: línea de 2 px, puntos de 8 px, eje y recesivo, tooltip al pasar/tocar.
   pts = [{date, v, tip}] · opts.ref = línea de referencia opcional (p. ej. peso objetivo) */
const CHS={};
function chartSvg(key, pts, opts={}){
  const two=pts.some(r=>r.v2!=null);
  const W=340, H=180, pl=34, pr=two?34:12, pt=14, pb=26;
  const vals=pts.map(r=>r.v).concat(opts.ref!=null?[opts.ref]:[]);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(hi-lo<2){ lo-=1; hi+=1; }
  const span=hi-lo, stepRaw=span/3, mag=Math.pow(10,Math.floor(Math.log10(stepRaw))), step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=stepRaw);
  lo=Math.max(0,Math.floor(lo/step)*step); hi=Math.ceil(hi/step)*step;
  const x=i=>pts.length===1?(pl+(W-pl-pr)/2):pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  // segunda línea (opcional) con su propia escala a la derecha y las mismas rayas de fondo
  let y2=null, lo2=0, step2=1;
  if(two){
    const n=Math.round((hi-lo)/step), v2s=pts.map(r=>r.v2);
    let a=Math.min(...v2s), b=Math.max(...v2s); if(b-a<1){ a=Math.max(0,a-1); b+=1; }
    const mag2=Math.pow(10,Math.floor(Math.log10((b-a)/n)));
    step2=[1,2,2.5,5,10,20,25,50,100].map(m=>m*mag2).find(s=>Math.max(0,Math.floor(a/s)*s)+n*s>=b);
    lo2=Math.max(0,Math.floor(a/step2)*step2);
    y2=v=>pt+(H-pt-pb)*(1-(v-lo2)/(n*step2));
  }
  CHS[key]={pts, x, y, y2, W, H};
  let g='';
  for(let v=lo; v<=hi+1e-9; v+=step){ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" fill="${two?'var(--sage-dark)':'var(--muted)'}" text-anchor="end">${fmtKg(Math.round(v*100)/100)}</text>`;
    if(two){ const v2=lo2+Math.round((v-lo)/step)*step2; g+=`<text x="${W-pr+6}" y="${y(v)+4}" font-size="10" fill="var(--comb)" text-anchor="start">${fmtKg(Math.round(v2*100)/100)}</text>`; } }
  const poly=pts.map((r,i)=>`${x(i)},${y(r.v)}`).join(' ');
  const lbl=i=>{ const [yy,mm,dd]=pts[i].date.split('-'); return `${+dd}/${+mm}`; };
  const xl = pts.length===1 ? [0] : [0, pts.length-1];
  const ref = opts.ref!=null ? `<line x1="${pl}" x2="${W-pr}" y1="${y(opts.ref)}" y2="${y(opts.ref)}" stroke="var(--comb)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(opts.ref)-5}" font-size="10" font-weight="800" fill="var(--ink2)" text-anchor="end">${esc(opts.refLabel||'')}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Gráfico')}">
    ${g}${ref}
    ${xl.map(i=>`<text x="${x(i)}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="${pts.length===1?'middle':i===0?'start':'end'}">${lbl(i)}</text>`).join('')}
    <line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--line2)" stroke-width="1" opacity="0"/>
    ${pts.length>1?`<polyline points="${poly}" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${two&&pts.length>1?`<polyline points="${pts.map((r,i)=>x(i)+','+y2(r.v2)).join(' ')}" fill="none" stroke="var(--comb)" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${pts.length<=40?pts.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.v)}" r="4" fill="var(--sage)" stroke="#fff" stroke-width="2"/>`).join(''):''}
    ${two&&pts.length<=40?pts.map((r,i)=>`<circle cx="${x(i)}" cy="${y2(r.v2)}" r="3.5" fill="var(--comb)" stroke="#fff" stroke-width="2"/>`).join(''):''}
    <circle class="hp" r="6" fill="var(--sage)" stroke="#fff" stroke-width="2" opacity="0"/>
    ${two?'<circle class="hp2" r="5.5" fill="var(--comb)" stroke="#fff" stroke-width="2" opacity="0"/>':''}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/>
  </svg>`;
}
function chartBox(key, pts, opts){ return `<div class="chart-wrap" data-chart="${key}">${chartSvg(key,pts,opts)}<div class="tip"></div></div>`; }
function bindCharts(){
  document.querySelectorAll('[data-chart]').forEach(wrap=>{
    const C=CHS[wrap.dataset.chart]; if(!C) return;
    const svg=wrap.querySelector('svg'), tip=wrap.querySelector('.tip'), xh=svg.querySelector('.xh'), hp=svg.querySelector('.hp');
    const move=ev=>{
      const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)*C.W/r.width;
      let bi=0, bd=1e9; C.pts.forEach((_,i)=>{ const d=Math.abs(C.x(i)-px); if(d<bd){bd=d;bi=i;} });
      const h=C.pts[bi], cx=C.x(bi), cy=C.y(h.v);
      xh.setAttribute('x1',cx); xh.setAttribute('x2',cx); xh.setAttribute('opacity',1);
      hp.setAttribute('cx',cx); hp.setAttribute('cy',cy); hp.setAttribute('opacity',1);
      const hp2=svg.querySelector('.hp2'); if(hp2&&C.y2){ hp2.setAttribute('cx',cx); hp2.setAttribute('cy',C.y2(h.v2)); hp2.setAttribute('opacity',1); }
      tip.innerHTML=h.tip;
      tip.style.left=Math.min(Math.max(cx*r.width/C.W, 70), r.width-70)+'px'; tip.style.top=(cy*r.height/C.H)+'px'; tip.classList.add('on');
    };
    const leave=()=>{ tip.classList.remove('on'); xh.setAttribute('opacity',0); hp.setAttribute('opacity',0); const hp2=svg.querySelector('.hp2'); if(hp2) hp2.setAttribute('opacity',0); };
    svg.addEventListener('pointermove',move); svg.addEventListener('pointerdown',move); svg.addEventListener('pointerleave',leave);
  });
}

function seg(key, opts, fmt){ return `<div class="seg">${opts.map(o=>`<button class="${String(S.settings[key])===String(o)?'on':''}" onclick="setSetting('${key}','${o}')">${fmt?fmt(o):o}</button>`).join('')}</div>`; }
function setSetting(k,v){ S.settings[k] = (k==='tier') ? v : (isNaN(+v)?v:+v); save(); render(); }
function viewSettings(){
  const at=autoTier(levelFromXp(S.xp).lvl);
  const g=GOALS[S.settings.goal];
  return `<div class="card"><h3>🎯 Objetivo</h3>
    <div class="set-row"><div class="lb">${g?g.e+' '+g.n:'Sin elegir'}<small>${g?g.d:'Elige si quieres bajar, mantener o subir de peso'}</small></div><button class="btn sec small" onclick="chooseGoal(true)">Cambiar</button></div>
    <div class="set-row"><div class="lb">Circuito quemagrasa<small>Unos 8-10 min de cardio con mancuernas tras las pesas (en casa; en el gimnasio tienes cardio extra con máquinas)</small></div><button class="switch ${S.settings.finisher?'on':''}" onclick="S.settings.finisher=!S.settings.finisher;save();render()" aria-label="Circuito quemagrasa"></button></div>
  </div>
  <div class="card"><h3>🏋️ Entreno</h3>
    <div class="set-row"><div class="lb">Dónde entrenas<small>El orden Empuje → Tirón → Pierna es el mismo; en el gimnasio cambian los ejercicios y hay cardio extra</small></div><div class="seg">${[['home','Casa'],['gym','Gimnasio']].map(([k,l])=>`<button class="${S.settings.place===k?'on':''}" onclick="setPlace('${k}')">${l}</button>`).join('')}</div></div>
    ${atGym()?`<div class="set-row"><div class="lb">Material en el gimnasio<small>Puedes cambiar cada ejercicio suelto con el botón ⇄</small></div><div class="seg">${Object.entries(EQUIP).map(([k,q])=>`<button class="${S.settings.equip===k?'on':''}" onclick="setEquip('${k}')">${q.n}</button>`).join('')}</div></div>`:''}
    <div class="set-row"><div class="lb">Descanso entre series<small>Se pone en marcha al marcar una serie</small></div>${seg('rest',[60,90,120,180],o=>o<120?o+'s':(o/60)+'m')}</div>
    <div class="set-row"><div class="lb">Salto de peso<small>Lo que suman los botones − / +</small></div>${seg('step',[0.5,1,2,2.5],o=>fmtKg(+o))}</div>
    <div class="set-row" style="flex-wrap:wrap"><div class="lb">Dificultad<small>Rutina de casa: automática según tu nivel (ahora: ${RANKS[at].n}) o fija. En el gimnasio progresas subiendo peso.</small></div>
      <select class="sel" style="margin-top:0;width:100%" onchange="setSetting('tier',this.value)"><option value="auto" ${S.settings.tier==='auto'?'selected':''}>Automática</option>${RANKS.map((r,i)=>`<option value="${i}" ${String(S.settings.tier)===String(i)?'selected':''}>${r.e} ${r.n}</option>`).join('')}</select></div>
  </div>
  <div class="card"><h3>✨ Recordatorios de Kegel</h3>
    ${KEGEL_SLOTS.map((k,i)=>`<div class="set-row"><div class="lb">${k.ic} ${k.n}</div><input type="time" value="${S.settings.kegelTimes[i]}" onchange="S.settings.kegelTimes[${i}]=this.value;save()"></div>`).join('')}
    <div class="set-row"><div class="lb">Avisos en el móvil<small>Funcionan mientras la app esté abierta o en segundo plano reciente</small></div><button class="switch ${S.settings.notif?'on':''}" onclick="toggleNotif()" aria-label="Activar avisos"></button></div>
  </div>
  <div class="card"><h3>💾 Tus datos</h3><p class="sub" style="margin:4px 0 12px">Todo se guarda solo en este dispositivo. Haz una copia de vez en cuando por si cambias de móvil o borras el navegador.</p>
    <button class="btn sec" onclick="exportData()">⬇️ Descargar copia de seguridad</button><div style="height:8px"></div>
    <label class="btn ghost" style="cursor:pointer">⬆️ Restaurar copia<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label><div style="height:8px"></div>
    <button class="btn ghost" style="color:#B4412E" onclick="resetAll()">Empezar de cero</button></div>
  <p class="tiny" style="text-align:center">Mi Granja Fit · basada en Ascension System</p>`;
}
function toggleNotif(){
  if(S.settings.notif){ S.settings.notif=false; save(); render(); return; }
  if(!('Notification' in window)){ toast('Este navegador no permite avisos'); return; }
  Notification.requestPermission().then(p=>{ S.settings.notif = p==='granted'; if(p!=='granted') toast('Permiso denegado'); save(); render(); });
}
function notify(title, body){
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.controller){ navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body, icon:'icon-192.png', badge:'icon-192.png', tag:'kegel'})); }
    else new Notification(title,{body, icon:'icon-192.png'});
  }catch(e){}
}
function checkReminders(){
  if(rollover()) render();
  if(!S.settings.notif || typeof Notification==='undefined' || Notification.permission!=='granted') return;
  const now=new Date(), hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  S.settings.kegelTimes.forEach((t,i)=>{
    if(hm>=t && !S.day.kegel[i] && !S.day.notified[i]){ S.day.notified[i]=true; save(); notify('Hora del Kegel '+KEGEL_SLOTS[i].ic, `Sesión de ${KEGEL_SLOTS[i].n.toLowerCase()}: 2 minutos y +1 🌽 para tus gallinas.`); }
  });
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`mi-granja-${today()}.json`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d||!d.settings||!d.animals) throw 0; if(!confirm('Esto sustituirá tus datos actuales. ¿Seguir?')) return; S=migrate(d); saveNow(); render(); toast('Copia restaurada ✅'); }catch(e){ toast('Ese archivo no es una copia válida'); } };
  r.readAsText(file);
}
function resetAll(){ if(confirm('¿Seguro? Se borrará todo: entrenos, animales y huevos.') && confirm('De verdad de la buena… ¿borrar todo?')){ S=freshState(); saveNow(); switchTab('home'); } }
function migrate(s){
  const f=freshState();
  for(const k in f){ if(s[k]===undefined) s[k]=f[k]; }
  s.settings=Object.assign({}, f.settings, s.settings);
  if(!s.day||!s.day.kegel) s.day=newDay(today());
  if(!s.day.up) s.day.up={};
  if(!s.day.sid) s.day.sid={};
  if(/^gym/.test(s.day.gate||'')){ s.day.gate=null; s.day.sets={}; s.day.sid={}; s.day.up={}; s.day.eq={}; } // de la versión de 3 días
  return s;
}

/* ---------- Arranque ---------- */
S=migrate(load());
render();
setInterval(checkReminders, 30000);
setInterval(tickClock, 15000);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
